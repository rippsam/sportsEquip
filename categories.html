<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Categories &mdash; Sports Equip</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* ── MAIN ── */
    .cats-page {
      padding: 44px 40px 72px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── DEPT BLOCK ── */
    .dept-block { margin-bottom: 52px; }
    .dept-header {
      text-align: center;
      margin-bottom: 16px;
    }
    .dept-name {
      font-size: 72px;
      font-weight: 700;
      color: var(--black);
      letter-spacing: -2px;
      line-height: 1.0;
    }

    /* ── CATEGORY GRID ── */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 10px;
    }
    .cat-card {
      background: var(--gray-50);
      border: 0.5px solid var(--gray-200);
      border-radius: 10px;
      padding: 16px 18px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      text-decoration: none;
    }
    .cat-card:hover {
      background: var(--gray-100);
      border-color: var(--gray-400);
    }
    .cat-card:active { transform: scale(0.98); }
    .cat-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--black);
      line-height: 1.3;
    }

    /* ── FOOTER OVERRIDES ── */
    .footer {
      background: var(--gray-50);
      border-top: 0.5px solid var(--gray-300);
      padding: 44px 40px 28px;
    }
    .footer-grid {
      max-width: 1200px;
      margin: 0 auto 36px;
    }
    .footer-bottom {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 998px) {
      .cats-page { padding: 28px 20px 48px; }
      .cat-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
      .footer { padding: 32px 20px 24px; }
    }
  </style>
</head>
<body>

<nav class="nav" id="site-nav"></nav>
<script src="js/utils.js"></script>
<script src="js/nav.js"></script>

<!-- HERO -->
<div class="hero-strip">
  <p class="hero-eyebrow">Browse</p>
  <h1 class="hero-title">All categories</h1>
</div>

<!-- MAIN -->
<main class="cats-page">

  <!-- SALE BANNER -->
  <div class="sale-banner">
    <div>
      <p class="sale-eyebrow">Limited time</p>
      <p class="sale-heading">Up to 40% off select gear</p>
      <p class="sale-sub">New markdowns added daily across all departments</p>
    </div>
    <button class="sale-btn" onclick="location.href='sale.html'">Shop sale &rarr;</button>
  </div>

  <div id="cats-main"></div>

</main>

<footer class="footer" id="site-footer"></footer>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/categories.js"></script>
<script src="js/footer.js"></script>
</body>
</html>
