<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout &mdash; Sports Equip</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<nav class="nav" id="site-nav"></nav>
<script src="js/utils.js"></script>
<script src="js/nav.js"></script>

<!-- CHECKOUT -->
<div class="checkout-layout">

  <!-- FORM -->
  <div>
    <button class="checkout-back-btn" id="back-btn">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M10 3L5 8l5 5"/>
      </svg>
      Back to cart
    </button>

    <h1 class="checkout-title">Checkout</h1>

    <p class="checkout-section-label">Contact information</p>
    <div class="checkout-input-group">
      <label for="f-name">Full name</label>
      <input id="f-name" type="text" placeholder="Jane Smith" maxlength="30" autocomplete="name">
    </div>

    <p class="checkout-section-label" style="margin-top:24px;">Shipping address</p>
    <div class="checkout-input-group">
      <label for="f-street">Street address</label>
      <input id="f-street" type="text" placeholder="123 Main St" maxlength="40" autocomplete="street-address">
    </div>
    <div class="checkout-input-group">
      <label for="f-apt">Apt, suite, etc. <span style="color:#bbb;font-weight:400;">(optional)</span></label>
      <input id="f-apt" type="text" placeholder="Apt 4B" maxlength="30" autocomplete="address-line2">
    </div>
    <div class="checkout-input-row">
      <div class="checkout-input-group">
        <label for="f-city">City</label>
        <input id="f-city" type="text" placeholder="Salt Lake City" maxlength="30" autocomplete="address-level2">
      </div>
      <div class="checkout-input-group">
        <label for="f-state">State</label>
        <div class="checkout-select-wrap">
          <select id="f-state" autocomplete="address-level1">
            <option value="">Select state</option>
            <option>AL</option><option>AK</option><option>AZ</option><option>AR</option><option>CA</option>
            <option>CO</option><option>CT</option><option>DE</option><option>FL</option><option>GA</option>
            <option>HI</option><option>ID</option><option>IL</option><option>IN</option><option>IA</option>
            <option>KS</option><option>KY</option><option>LA</option><option>ME</option><option>MD</option>
            <option>MA</option><option>MI</option><option>MN</option><option>MS</option><option>MO</option>
            <option>MT</option><option>NE</option><option>NV</option><option>NH</option><option>NJ</option>
            <option>NM</option><option>NY</option><option>NC</option><option>ND</option><option>OH</option>
            <option>OK</option><option>OR</option><option>PA</option><option>RI</option><option>SC</option>
            <option>SD</option><option>TN</option><option>TX</option><option>UT</option><option>VT</option>
            <option>VA</option><option>WA</option><option>WV</option><option>WI</option><option>WY</option>
          </select>
        </div>
      </div>
    </div>
    <div class="checkout-input-row">
      <div class="checkout-input-group">
        <label for="f-zip">ZIP code</label>
        <input id="f-zip" type="text" placeholder="84101" maxlength="5" inputmode="numeric" autocomplete="postal-code">
      </div>
      <div class="checkout-input-group">
        <label>Country</label>
        <input type="text" value="USA" disabled autocomplete="country-name">
      </div>
    </div>

    <div class="checkout-divider-row">
      <div class="checkout-divider-line"></div>
      <span class="checkout-divider-text">Or sign in</span>
      <div class="checkout-divider-line"></div>
    </div>

    <button class="checkout-signin-btn" id="signin-btn" type="button">Sign in to your account</button>
    <button id="place-order-btn" class="checkout-place-order-btn disabled" disabled type="button">Continue</button>
  </div>

  <!-- ORDER SUMMARY -->
  <div>
    <div class="checkout-summary-box">
      <p class="checkout-summary-title">Order summary</p>
      <div id="checkout-items"></div>
      <hr class="checkout-summary-divider">
      <div class="checkout-summary-row">
        <span class="label">Subtotal</span>
        <span id="summary-subtotal" class="val"></span>
      </div>
      <div class="checkout-summary-row">
        <span class="label">Shipping</span>
        <span id="summary-shipping"></span>
      </div>
      <hr class="checkout-summary-divider">
      <div class="checkout-summary-total">
        <span>Total</span>
        <span id="summary-total"></span>
      </div>
    </div>
  </div>

</div>

<footer class="footer" id="site-footer"></footer>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>
<script src="js/footer.js"></script>
</body>
</html>
