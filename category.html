<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Category &mdash; Sports Equip</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .cat-page {
      padding: 44px 40px 72px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .footer {
      background: var(--gray-50);
      border-top: 0.5px solid var(--gray-300);
      padding: 44px 40px 28px;
    }
    .footer-grid { max-width: 1200px; margin: 0 auto 36px; }
    .footer-bottom { max-width: 1200px; margin: 0 auto; }
    @media (max-width: 998px) {
      .cat-page { padding: 28px 20px 48px; }
      .footer { padding: 32px 20px 24px; }
    }
  </style>
</head>
<body>

<nav class="nav" id="site-nav"></nav>
<script src="js/utils.js"></script>
<script src="js/nav.js"></script>

<!-- HERO -->
<div class="hero-strip">
  <p class="hero-eyebrow">Browse</p>
  <h1 class="hero-title" id="cat-hero-title">Category</h1>
</div>

<!-- SALE BANNER -->
<div class="sale-banner-wrap">
  <div class="sale-banner">
    <div>
      <p class="sale-eyebrow">Limited time</p>
      <p class="sale-heading">Up to 40% off select gear</p>
      <p class="sale-sub">New markdowns added daily across all departments</p>
    </div>
    <button class="sale-btn" onclick="location.href='sale.html'">Shop sale &rarr;</button>
  </div>
</div>

<!-- MAIN -->
<main class="cat-page">
  <div id="cat-product-grid" class="product-grid"></div>
  <div id="cat-sentinel" style="height:1px"></div>
</main>

<footer class="footer" id="site-footer"></footer>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/badge-registry.js"></script>
<script src="js/category.js"></script>
<script src="js/footer.js"></script>
</body>
</html>
