<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Sports Equip</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    .login-card {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .login-card h2 {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 6px;
      color: var(--black);
    }
    .login-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .login-field label {
      font-size: 11px;
      font-weight: 500;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .login-field input {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    .login-field input:focus { border-color: var(--black); }
    .login-submit { margin-top: 4px; }
    .login-logo { width: 110px; height: 110px; object-fit: contain; display: block; align-self: center; }
    .login-below-save { display: flex; align-items: center; justify-content: space-between; }
    .login-have-account { font-size: 13px; color: var(--blue-link); }
    .login-register { background: none; border: none; padding: 0; font-size: 13px; font-family: inherit; color: var(--blue-link); cursor: pointer; }
    .login-register:hover { text-decoration: underline; }
  </style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <a class="nav-logo" href="index.html"><img src="assets/images/logo.png" alt="Sports Equip" class="nav-logo-img"></a>
  <ul id="nav-dept-links" class="nav-links"></ul>
  <div class="nav-right">
    <button class="nav-icon-btn" aria-label="Search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.2"/>
        <line x1="10.2" y1="10.2" x2="14" y2="14" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="nav-icon-btn" aria-label="Account">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.2"/>
        <path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="nav-icon-btn" id="nav-cart-btn" aria-label="Cart">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M2 3h12l-1.5 8H3.5L2 3z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        <circle cx="5.5" cy="13" r="1" fill="currentColor"/>
        <circle cx="10.5" cy="13" r="1" fill="currentColor"/>
      </svg>
      <span class="cart-badge" id="cart-badge" style="display:none">0</span>
    </button>
  </div>
</nav>

<main class="login-page">
  <div class="login-card">
    <img src="assets/images/SportEquipNoWordslogo.png" alt="Sports Equip" class="login-logo">
    <h2>Create account</h2>
    <div class="login-field">
      <label for="reg-username">Username</label>
      <input type="text" id="reg-username" placeholder="Choose a username" autocomplete="username" maxlength="20">
    </div>
    <div class="login-field">
      <label for="reg-password">Password</label>
      <input type="password" id="reg-password" placeholder="Choose a password" autocomplete="new-password" maxlength="20">
    </div>
    <div class="login-field">
      <label for="reg-confirm">Retype Password</label>
      <input type="password" id="reg-confirm" placeholder="Confirm password" autocomplete="new-password" maxlength="20">
    </div>
    <button class="btn-black login-submit" id="reg-save-btn">Save</button>
    <div class="login-below-save">
      <span class="login-have-account">Have an account?</span>
      <button class="login-register" onclick="location.href='login.html'">Sign in →</button>
    </div>
  </div>
</main>

<script src="js/cart.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  document.getElementById('reg-save-btn').addEventListener('click', function() {
    const user    = document.getElementById('reg-username').value.trim();
    const pass    = document.getElementById('reg-password').value.trim();
    const confirm = document.getElementById('reg-confirm').value.trim();
    if (user && pass && confirm) {
      sessionStorage.setItem('auth_granted', '1');
      location.href = 'login-success.html';
    }
  });

  document.getElementById('reg-confirm').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('reg-save-btn').click();
  });

  window.addEventListener('pageshow', function() {
    if (sessionStorage.getItem('clear_form')) {
      sessionStorage.removeItem('clear_form');
      document.getElementById('reg-username').value = '';
      document.getElementById('reg-password').value = '';
      document.getElementById('reg-confirm').value = '';
    }
  });
</script>
</body>
</html>
