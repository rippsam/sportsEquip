<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gift Cards &mdash; Sports Equip</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<nav class="nav" id="site-nav"></nav>
<script src="js/utils.js"></script>
<script src="js/nav.js"></script>

<!-- GIFT CARDS -->
<section class="section">
  <div class="sec-header" style="margin-bottom:32px;">
    <div>
      <p class="sec-eyebrow">Company</p>
      <h2 class="sec-title">Gift cards</h2>
    </div>
    <p style="font-size:13px;color:var(--gray-muted);align-self:flex-end;">Pick the right amount</p>
  </div>
  <div id="gift-grid" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;"></div>
</section>

<canvas id="cc" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;"></canvas>

<footer class="footer" id="site-footer"></footer>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script>
  const COUNT = 80;
  const winnerIdx = Math.floor(Math.random() * COUNT);

  function randAmount() {
    const d = Math.floor(Math.random() * 9999) + 1;
    const c = Math.floor(Math.random() * 100);
    return '$' + d.toLocaleString() + '.' + String(c).padStart(2, '0');
  }

  function launchConfetti(callback) {
    const canvas = document.getElementById('cc');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const colors = ['#f43f5e', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#8b5cf6', '#ec4899', '#06b6d4'];

    const pieces = Array.from({ length: 250 }).map(function() {
      return {
        x:     Math.random() * canvas.width,
        y:     Math.random() * canvas.height - canvas.height,
        w:     Math.random() * 36 + 20,
        h:     Math.random() * 18 + 12,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot:   Math.random() * Math.PI * 2,
        rs:    (Math.random() - 0.5) * 0.15,
        vx:    (Math.random() - 0.5) * 7,
        vy:    Math.random() * 5 + 3,
        op:    1
      };
    });

    let start = null;
    const DUR = 3000;

    function draw(ts) {
      if (!start) start = ts;
      const elapsed = ts - start;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      pieces.forEach(function(p) {
        p.x  += p.vx;
        p.y  += p.vy;
        p.rot += p.rs;
        p.vy  += 0.12;
        p.op   = Math.max(0, 1 - elapsed / DUR);

        ctx.save();
        ctx.globalAlpha = p.op;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });

      if (elapsed < DUR) {
        requestAnimationFrame(draw);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (callback) callback();
      }
    }

    requestAnimationFrame(draw);
  }

  const grid = document.getElementById('gift-grid');

  for (let i = 0; i < COUNT; i++) {
    const btn = document.createElement('button');
    btn.textContent = randAmount();
    btn.style.cssText = [
      'border-radius:999px',
      'background:#000000',
      'color:#ffffff',
      'border:none',
      'padding:14px 24px',
      'font-family:inherit',
      'font-size:15px',
      'font-weight:700',
      'cursor:pointer',
      'outline:none',
      'display:inline-block'
    ].join(';');

    const isWinner = i === winnerIdx;

    btn.addEventListener('mouseenter', function() {
      btn.style.background = '#222222';
    });

    btn.addEventListener('mouseleave', function() {
      btn.style.background = (isWinner && btn.dataset.won) ? '#2a7d4f' : '#000000';
    });

    btn.addEventListener('click', function() {
      if (btn.dataset.used) return;
      btn.dataset.used = '1';

      if (isWinner) {
        btn.dataset.won = '1';
        btn.style.background = '#2a7d4f';
        launchConfetti(function() { location.href = 'index.html'; });
      } else {
        btn.style.background = '#cc0000';
        btn.animate([
          { transform: 'translateX(0)' },
          { transform: 'translateX(-7px)' },
          { transform: 'translateX(7px)' },
          { transform: 'translateX(-5px)' },
          { transform: 'translateX(5px)' },
          { transform: 'translateX(0)' }
        ], { duration: 350, easing: 'ease' }).onfinish = function() {
          btn.style.background = '#000000';
        };
      }
    });

    grid.appendChild(btn);
  }
</script>
<script src="js/footer.js"></script>
</body>
</html>
